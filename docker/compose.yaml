name: vocora

services:
  database:
    build: database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    volumes:
      - ./database/volume:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is not set in .env}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
